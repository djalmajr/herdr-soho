# herdr-soho legacy shim plugin — compatibility window only, until v0.4.0.
# It keeps the old plugin id (djalmajr.herdr-soho) working while shortcuts
# and keybindings migrate to the soho plugin (plugin/herdr-plugin.toml,
# id djalmajr.soho): it exposes the same actions and panes, running the
# same `soho` binary. Move your shortcuts to the soho ids — for example
# bind pick to djalmajr.soho.pick instead of djalmajr.herdr-soho.pick.
# Herdr injects HERDR_PLUGIN_ID=djalmajr.herdr-soho for the actions below,
# and the bridge (soho plugin bridge) opens the panes under that id, so
# the shim's panes resolve even when only the shim is installed. Remove
# this manifest after v0.4.0.
id = "djalmajr.herdr-soho"
name = "herdr-soho (legacy shim)"
version = "0.3.0"
min_herdr_version = "0.9.1"
description = "Legacy shim for the soho plugin (djalmajr.soho): the same read-only actions (team, roster, doctor) and unified session picker (pick) under the old id, running the soho binary. It exists only during the compatibility window, until v0.4.0 — move your shortcuts to the soho ids (for example djalmajr.soho.pick instead of djalmajr.herdr-soho.pick); only the panel's x and g confirmations write."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "doctor"
title = "Doctor: open the team panel on the doctor view"
description = "Read-only: opens the team panel on the focused workspace, starting at the doctor view (config, hooks, memory, dispatch state, panes and the Herdr/CLI versions). Only the panel's `x` and `g` confirmations write."
contexts = ["workspace"]
command = ["soho", "plugin", "bridge", "doctor"]

[[actions]]
id = "roster"
title = "Roster: open the team panel"
description = "Read-only: opens the team panel on the focused workspace (who is running, what it does, and the roster, orchestrator first). Only the panel's `x` and `g` confirmations write."
contexts = ["workspace"]
command = ["soho", "plugin", "bridge", "roster"]

[[actions]]
id = "team"
title = "Team: open the team panel"
description = "Read-only: opens the team panel on the focused workspace: the team explanation, the workers (release with x, after confirmation), the doctor, the resources (gc, with g, after confirmation) and the friction. Reload with r."
contexts = ["workspace"]
command = ["soho", "plugin", "bridge", "team"]

[[panes]]
id = "picker"
title = "soho: find a session"
placement = "popup"
width = "80%"
height = "80%"
platforms = ["linux", "macos", "windows"]
command = ["soho", "plugin", "picker"]

[[panes]]
id = "team"
title = "soho: team"
placement = "overlay"
platforms = ["linux", "macos", "windows"]
command = ["soho", "plugin", "team"]

[[panes]]
id = "team-doctor"
title = "soho: doctor"
placement = "overlay"
platforms = ["linux", "macos", "windows"]
command = ["soho", "plugin", "team", "--view", "doctor"]

[[actions]]
id = "pick"
title = "Sessions: search, copy or focus"
description = "Opens a centered session popup at 80% of the terminal width and height. All panes, agents or terminals can be filtered by status and task. Table and tree views group by machine and workspace; v switches views, f/t filter, p/w/s sort, and Tab switches search/list focus. Arrow keys, PgUp/PgDn and the mouse wheel select items. It refreshes every 10 s or with r/Ctrl-R. With the list focused, c copies only machine/pane and shows status-bar feedback without closing. Enter focuses the selection; Esc or Ctrl-C close."
contexts = ["workspace"]
command = ["soho", "plugin", "bridge", "pick"]
