name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # The runner's preinstalled Go selects the go.mod minimum (1.25) or
      # fetches it; no extra runtime installers.
      GOTOOLCHAIN: auto
      RELEASE_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      # Thin pwsh glue only: the release logic lives in the native Go tool
      # (cmd/herdr-soho-release), not in Node/Bash workflow steps.
      - name: Check out the exact commit
        shell: pwsh
        run: |
          git init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "git config core.autocrlf failed" }
          git remote add origin "https://github.com/${env:RELEASE_REPO}.git"
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          git fetch --depth 1 origin "${env:RELEASE_SHA}"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout --detach "${env:RELEASE_SHA}"
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
      - name: Build release artifacts
        shell: pwsh
        run: |
          go run ./cmd/herdr-soho-release ci-build
          if ($LASTEXITCODE -ne 0) { throw "ci-build failed" }
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/herdr-soho-release ci-publish
          if ($LASTEXITCODE -ne 0) { throw "ci-publish failed" }
