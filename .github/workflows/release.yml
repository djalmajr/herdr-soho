name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      # Build with the newest stable toolchain (its standard library fixes ship in
      # the binary); go.mod's go line stays the minimum. No go.sum, so no cache.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version=dev
          fi
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              suffix=
              if [[ "$os" == windows ]]; then suffix=.exe; fi
              output="dist/herdr-soho_${os}_${arch}${suffix}"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/djalmajr/herdr-soho/internal/cli.version=${version}" -o "$output" ./cmd/herdr-soho
            done
          done
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum herdr-soho_* > SHA256SUMS
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=("$GITHUB_REF_NAME" dist/herdr-soho_* dist/SHA256SUMS --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
