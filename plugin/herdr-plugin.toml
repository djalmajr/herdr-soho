# herdr-agents optional plugin — read-only actions (slice 1).
# Manifest contract: https://herdr.dev/docs/plugins/
# Actions run `node bridge.mjs <subcommand>` from the plugin directory;
# the bridge resolves the focused target from HERDR_PLUGIN_CONTEXT_JSON,
# validates the pane with HERDR_BIN_PATH, and runs the skill CLI in the
# pane's cwd with HERDR_AGENTS_NOWRITE=1. No action creates workers,
# regrids, setups or writes to the focused project (no .gitignore entry,
# no state directory).
id = "djalmajr.herdr-agents"
name = "herdr-agents"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Read-only actions to diagnose and list the agents of the focused workspace (doctor and roster), reusing the herdr-agents skill CLI. Actions run the CLI in read-only mode: they inspect the focused project and never write to it (no .gitignore entry, no state directory)."
platforms = ["macos"]

[[actions]]
id = "doctor"
title = "Doctor: diagnose the focused workspace"
description = "Read-only: shows the target (workspace and cwd) and the result of the CLI `herdr-agents doctor` in the focused pane's cwd, without writing to the project."
contexts = ["workspace"]
command = ["node", "bridge.mjs", "doctor"]

[[actions]]
id = "roster"
title = "Roster: agents of the focused workspace"
description = "Read-only: shows the target (workspace and cwd) and the result of the CLI `herdr-agents roster` in the focused pane's cwd, without writing to the project."
contexts = ["workspace"]
command = ["node", "bridge.mjs", "roster"]
